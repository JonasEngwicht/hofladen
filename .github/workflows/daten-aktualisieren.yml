name: Daten aktualisieren

# Holt die Hofläden aus OpenStreetMap (über QLever) und committet data/osm-eintraege.json.
# Jeder Commit löst bei Cloudflare automatisch einen neuen Deploy aus.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1' # montags 03:17 UTC
    - cron: '43 2 * * 4' # donnerstags 02:43 UTC
  push:
    branches: [main]
    paths:
      - scripts/fetch-osm.mjs
      - scripts/import-osm.mjs
      - scripts/lib.mjs
      - .github/workflows/daten-aktualisieren.yml

permissions:
  contents: write

concurrency:
  group: daten
  cancel-in-progress: false

jobs:
  aktualisieren:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Daten von QLever holen
        run: node scripts/fetch-osm.mjs data/quellen/osm-roh.json
      - name: Einträge aufbereiten
        run: node scripts/import-osm.mjs data/quellen/osm-roh.json
      - name: Testbuild
        run: node scripts/build.mjs
      - name: Commit, falls sich etwas geändert hat
        id: commit
        run: |
          git config user.name "hofladenliste-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/osm-eintraege.json
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Daten aus OpenStreetMap aktualisiert"
            git push
            echo "geaendert=ja" >> "$GITHUB_OUTPUT"
          fi
      # Cloudflare baut bei Pushes derzeit nicht automatisch; daher den Deploy Hook aufrufen.
      # Die Hook-URL liegt als Repository-Secret CF_DEPLOY_HOOK (Settings > Secrets and variables > Actions).
      - name: Cloudflare-Deploy ausloesen
        if: steps.commit.outputs.geaendert == 'ja' || github.event_name == 'workflow_dispatch'
        env:
          HOOK: ${{ secrets.CF_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "Secret CF_DEPLOY_HOOK fehlt, Deploy bitte manuell ausloesen."; exit 0; fi
          curl -fsS -X POST "$HOOK" > /dev/null && echo "Deploy ausgeloest."
