name: Daten aktualisieren

# Holt die Hofläden und Wochenmärkte aus OpenStreetMap (Overpass, ersatzweise QLever) und committet
# data/osm-eintraege.json und data/osm-maerkte.json.
# Jeder Commit löst bei Cloudflare automatisch einen neuen Deploy aus.
on:
  workflow_dispatch:
    inputs:
      schwund_erlauben:
        description: Mehr entfallene Einträge zulassen (nach gewollten Regeländerungen)
        type: boolean
        default: false
  schedule:
    - cron: '17 3 * * 1' # montags 03:17 UTC
    - cron: '43 2 * * 4' # donnerstags 02:43 UTC
  push:
    branches: [main]
    paths:
      - scripts/fetch-osm.mjs
      - scripts/import-osm.mjs
      - scripts/import-maerkte.mjs
      - scripts/lib.mjs
      - .github/workflows/daten-aktualisieren.yml

permissions:
  contents: write

concurrency:
  group: daten
  cancel-in-progress: false

jobs:
  aktualisieren:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Hofläden und Automaten holen und aufbereiten
        id: hoefe
        continue-on-error: true
        env:
          ERLAUBE_SCHWUND: ${{ inputs.schwund_erlauben && '1' || '' }}
        run: node scripts/fetch-osm.mjs data/quellen/osm-roh.json && node scripts/import-osm.mjs data/quellen/osm-roh.json
      - name: Wochenmärkte holen und aufbereiten
        id: maerkte
        continue-on-error: true
        run: node scripts/fetch-osm.mjs --maerkte data/quellen/maerkte-roh.json && node scripts/import-maerkte.mjs data/quellen/maerkte-roh.json
      - name: Testbuild
        id: build
        run: node scripts/build.mjs && node scripts/verlauf.mjs
      # Ein fehlgeschlagener Abruf lässt die bisherigen Daten unverändert; der andere Teil wird trotzdem übernommen.
      - name: Commit, falls sich etwas geändert hat
        id: commit
        if: steps.build.outcome == 'success'
        uses: ./.github/actions/committen
        with:
          dateien: data/osm-eintraege.json data/osm-maerkte.json data/seiten-stand.json data/verlauf.json
          nachricht: Daten aus OpenStreetMap aktualisiert
      - name: Cloudflare-Deploy auslösen
        if: steps.commit.outputs.geaendert == 'ja' || github.event_name == 'workflow_dispatch'
        uses: ./.github/actions/deployen
        with:
          hook: ${{ secrets.CF_DEPLOY_HOOK }}
      - name: Fehlgeschlagenen Abruf anzeigen
        if: steps.hoefe.outcome == 'failure' || steps.maerkte.outcome == 'failure'
        run: |
          echo "Hofläden: ${{ steps.hoefe.outcome }}, Wochenmärkte: ${{ steps.maerkte.outcome }} – bisherige Daten bleiben, nächster Lauf versucht es erneut."
          exit 1
