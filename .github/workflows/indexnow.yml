name: IndexNow melden

# Meldet nach jedem erfolgreichen Deploy (Live-Prüfung grün) die geänderten Seiten an IndexNow (Bing u. a.).
# Manuell mit „alle“ einmal sämtliche Seiten aus den Sitemaps.
on:
  workflow_run:
    workflows: ['Live-Prüfung']
    types: [completed]
  workflow_dispatch:
    inputs:
      alle:
        description: Alle Seiten aus den Sitemaps melden
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  melden:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build (Sitemaps)
        run: node scripts/build.mjs > /dev/null
      # Meldestand (welche URL mit welchem lastmod schon gemeldet ist) zwischen den Läufen merken.
      # Liegt als einzelner Commit ohne Verlauf auf dem Branch „indexnow-stand“ (der Actions-Cache ließ sich aus
      # workflow_run-Läufen meist nicht schreiben: „cache write denied“ → jeder Lauf meldete dieselben URLs neu).
      - name: Meldestand laden (Branch)
        id: stand
        run: |
          if git fetch -q --depth=1 origin indexnow-stand 2>/dev/null && git show FETCH_HEAD:indexnow-gemeldet.json > indexnow-gemeldet.json; then
            echo "quelle=branch" >> "$GITHUB_OUTPUT"; echo "Meldestand vom Branch: $(wc -c < indexnow-gemeldet.json) Bytes"
          else rm -f indexnow-gemeldet.json; echo "quelle=keine" >> "$GITHUB_OUTPUT"; fi
      - name: Meldestand laden (Cache, nur beim ersten Mal)
        if: steps.stand.outputs.quelle == 'keine'
        uses: actions/cache/restore@v4
        with:
          path: indexnow-gemeldet.json
          key: indexnow-gemeldet-${{ github.run_id }}
          restore-keys: indexnow-gemeldet-
      - name: An IndexNow melden (nur Neues und Geändertes)
        run: node scripts/indexnow.mjs --gemeldet indexnow-gemeldet.json ${{ inputs.alle && '--alle' || '' }}
      - name: Meldestand sichern (Branch, ein Commit ohne Verlauf)
        if: always()
        run: |
          [ -f indexnow-gemeldet.json ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          blob=$(git hash-object -w indexnow-gemeldet.json)
          tree=$(printf '100644 blob %s\tindexnow-gemeldet.json\n' "$blob" | git mktree)
          commit=$(git commit-tree "$tree" -m "IndexNow-Meldestand ${{ github.run_id }}")
          git push -q -f origin "$commit:refs/heads/indexnow-stand" && echo "Meldestand gesichert."
