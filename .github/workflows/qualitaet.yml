name: Kontrolllauf Datenqualität

# Prüft alle Einträge auf Dopplungen, Feldfehler und Widersprüche (scripts/qualitaet-bericht.mjs)
# und legt den Bericht unter docs/berichte/qualitaet.csv ab, dazu die Liste dünner Hofseiten (docs/duenne-hofseiten.csv). Sichere Fälle behebt schon der Build.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 9 * *' # monatlich am 9. um 05:17 UTC, nach dem Impressum-Lauf

permissions:
  contents: write

concurrency:
  group: daten
  cancel-in-progress: false

jobs:
  bericht:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build mit Liste
        run: LISTE_EXPORT=/tmp/liste.json node scripts/build.mjs | grep -E "Bereinigung|Build fertig"
      - name: Bericht
        run: node scripts/qualitaet-bericht.mjs /tmp/liste.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Liste dünne Hofseiten (noindex)
        run: node scripts/duenne-liste.mjs /tmp/liste.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Commit
        uses: ./.github/actions/committen
        with:
          dateien: docs/berichte/qualitaet.csv docs/duenne-hofseiten.csv
          nachricht: "Kontrolllauf Datenqualität: Bericht aktualisiert"
