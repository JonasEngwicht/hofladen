name: Kontrolllauf Datenqualität

# Prüft alle Einträge auf Dopplungen, Feldfehler und Widersprüche (scripts/qualitaet-bericht.mjs)
# und legt den Bericht unter docs/berichte/qualitaet.csv ab. Sichere Fälle behebt schon der Build.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 9 * *' # monatlich am 9. um 05:17 UTC, nach dem Impressum-Lauf

permissions:
  contents: write

concurrency:
  group: daten
  cancel-in-progress: false

jobs:
  bericht:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build mit Liste
        run: LISTE_EXPORT=/tmp/liste.json node scripts/build.mjs | grep -E "Bereinigung|Build fertig"
      - name: Bericht
        run: node scripts/qualitaet-bericht.mjs /tmp/liste.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Commit
        run: |
          git config user.name "hofladenliste-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/berichte/qualitaet.csv
          if git diff --cached --quiet; then echo "Keine Änderungen."; exit 0; fi
          git commit -m "Kontrolllauf Datenqualität: Bericht aktualisiert"
          git checkout -- .
          git pull --rebase -X theirs -q
          git push
