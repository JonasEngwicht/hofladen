name: Tests

# Baut die Seite und prüft Routing, Meta-Angaben, JSON-LD (gegen das Schema.org-Vokabular) und Sitemaps.
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Schema.org-Vokabular laden
        run: curl -fsSL -o /tmp/schemaorg.jsonld https://schema.org/version/latest/schemaorg-current-https.jsonld
      - name: Build
        run: node scripts/build.mjs
      - name: Tests
        env:
          SCHEMAORG_JSONLD: /tmp/schemaorg.jsonld
        run: node --test tests/*.test.mjs
      - name: Tests Verwaltungsdaten (Python)
        run: python3 tests/kommunal_test.py && python3 tests/dzt_test.py
