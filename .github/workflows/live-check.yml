name: Live-Prüfung

# Prüft die ausgerollte Seite (Statuscodes, Weiterleitungen) und misst mit PageSpeed Insights (mobil).
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Nur deployen', 'Daten aktualisieren', 'Betreiberdaten übernehmen']
    types: [completed]

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generierte Routen erzeugen
        run: node scripts/build.mjs > /dev/null
      - name: Warten, bis Cloudflare fertig gebaut hat
        if: github.event_name == 'workflow_run'
        run: sleep 240
      - name: Live-Prüfung
        env:
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
        run: node scripts/live-check.mjs https://hofladenliste.de
      - name: Browser-Prüfung (JavaScript läuft auf den wichtigsten Seitentypen)
        if: always()
        run: >-
          node scripts/browser-pruefung.mjs https://hofladenliste.de/ https://hofladenliste.de/hof/hofladen-gut-clarenhof-frechen/
          https://hofladenliste.de/bayern/ https://hofladenliste.de/brandenburg/spree-neisse/ https://hofladenliste.de/milchtankstelle/ https://hofladenliste.de/saisonkalender/ https://hofladenliste.de/karte/
