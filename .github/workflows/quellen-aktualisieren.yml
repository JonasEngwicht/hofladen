name: Offene Quellen aktualisieren

# Holt einmal im Monat Hofläden und Automaten aus offenen Quellen (keine OSM-Daten, keine Verzeichnisse von Wettbewerbern):
#  - Overture Maps Places (CDLA-Permissive-2.0 / Apache-2.0), scripts/fetch-overture.py
#  - Foursquare Open Source Places (Apache-2.0, Hugging Face, Secret HUGGINGFACE_KEY), scripts/fetch-foursquare.py
#  - Karte von morgen (CC0-1.0), scripts/fetch-kvm.mjs
#  - offene Verwaltungsdaten (CC0, CC BY 4.0, Datenlizenz Deutschland Zero/Namensnennung 2.0), scripts/fetch-kommunal.py
# Kandidaten mit eindeutigem Namen, aber niedriger Konfidenz werden über die eigene Website des Hofs geprüft
# (scripts/websites-pruefen.mjs). Auswahl und Abgleich: scripts/quellen.mjs, scripts/import-quellen.mjs → data/offene-quellen.json.
# Schlägt der Abruf einer Quelle fehl, bleiben deren bisherige Einträge erhalten. Veröffentlichte Einträge haben Bestandsschutz
# und bleiben bis zu zwei Läufe erhalten, wenn ihre Quelle sie nicht mehr führt.
on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 26 * *' # monatlich am 26.

permissions:
  contents: write

concurrency:
  group: daten
  cancel-in-progress: false

jobs:
  aktualisieren:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install duckdb==1.1.3 overturemaps
      - name: Overture Maps
        continue-on-error: true
        run: python scripts/fetch-overture.py "$RUNNER_TEMP/roh-overture.json"
      - name: Foursquare Open Source Places
        continue-on-error: true
        env:
          HF_TOKEN: ${{ secrets.HUGGINGFACE_KEY }}
        run: python scripts/fetch-foursquare.py "$RUNNER_TEMP/roh-foursquare.json"
      - name: Karte von morgen
        continue-on-error: true
        run: node scripts/fetch-kvm.mjs "$RUNNER_TEMP/roh-kvm.json"
      - name: Offene Verwaltungsdaten
        continue-on-error: true
        env:
          KOMMUNAL_SUCHE: '1' # zusätzlich GovData/Open.NRW durchsuchen (scripts/kommunal_suche.py), seit 20.11.2026 freigegeben
        run: python scripts/fetch-kommunal.py "$RUNNER_TEMP/roh-kommunal.json"
      - name: Websites unsicherer Kandidaten prüfen
        run: |
          ls "$RUNNER_TEMP"/roh-*.json
          node scripts/import-quellen.mjs "$RUNNER_TEMP"/roh-*.json --pruefliste "$RUNNER_TEMP/pruefliste.json"
          node scripts/websites-pruefen.mjs "$RUNNER_TEMP/pruefliste.json"
      - name: Auswählen und abgleichen
        run: node scripts/import-quellen.mjs "$RUNNER_TEMP"/roh-*.json
      - name: Testbuild
        run: node scripts/build.mjs
      - name: Commit, falls sich etwas geändert hat
        id: commit
        uses: ./.github/actions/committen
        with:
          dateien: data/offene-quellen.json data/website-pruefung.json data/seiten-stand.json
          nachricht: Daten aus offenen Quellen aktualisiert
      - name: Cloudflare-Deploy auslösen
        if: github.ref == 'refs/heads/main' && steps.commit.outputs.geaendert == 'ja'
        uses: ./.github/actions/deployen
        with:
          hook: ${{ secrets.CF_DEPLOY_HOOK }}
