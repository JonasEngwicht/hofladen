name: Overture-Daten aktualisieren

# Holt einmal im Monat Hofläden und Automaten aus Overture Maps Places (offene Lizenzen, keine OSM-Daten),
# ergänzt fehlende Einträge und füllt Kontaktdaten bestehender Einträge auf (data/overture.json).
on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 26 * *' # monatlich am 26. (Overture veröffentlicht etwa zur Monatsmitte)
  push:
    branches: [daten/overture]
    paths: [.github/workflows/overture-aktualisieren.yml]

permissions:
  contents: write

concurrency:
  group: daten
  cancel-in-progress: false

jobs:
  aktualisieren:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install duckdb==1.1.3 overturemaps
      - name: Kandidaten aus Overture holen
        run: python scripts/fetch-overture.py "$RUNNER_TEMP/overture-roh.json"
      - name: Auswählen und abgleichen
        run: node scripts/import-overture.mjs "$RUNNER_TEMP/overture-roh.json"
      - name: Testbuild
        run: node scripts/build.mjs
      - name: Commit, falls sich etwas geändert hat
        id: commit
        run: |
          git config user.name "hofladenliste-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/overture.json data/seiten-stand.json
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Daten aus Overture Maps aktualisiert"
            git pull --rebase --autostash -X theirs || true
            git push
            echo "geaendert=ja" >> "$GITHUB_OUTPUT"
          fi
      - name: Cloudflare-Deploy ausloesen
        if: github.ref == 'refs/heads/main' && steps.commit.outputs.geaendert == 'ja'
        env:
          HOOK: ${{ secrets.CF_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "Secret CF_DEPLOY_HOOK fehlt."; exit 0; fi
          curl -fsS -X POST "$HOOK" > /dev/null && echo "Deploy ausgeloest."
