name: Haltestellen aktualisieren

# Nächste Bus-, Straßenbahn- und Bahnhaltestelle für die Hofseiten (OpenStreetMap, ODbL).
# Speichert nur Haltestellen im Umkreis der Einträge in data/haltestellen.json.
on:
  workflow_dispatch:
  schedule:
    - cron: '37 4 12 * *' # monatlich

permissions:
  contents: write

concurrency:
  group: daten
  cancel-in-progress: false

jobs:
  haltestellen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Haltestellen holen
        run: node scripts/fetch-haltestellen.mjs
      - name: Testbuild
        run: node scripts/build.mjs
      - name: Commit, falls sich etwas geändert hat
        id: commit
        uses: ./.github/actions/committen
        with:
          dateien: data/haltestellen.json data/seiten-stand.json
          nachricht: Haltestellen aktualisiert
      - name: Cloudflare-Deploy auslösen
        if: steps.commit.outputs.geaendert == 'ja'
        uses: ./.github/actions/deployen
        with:
          hook: ${{ secrets.CF_DEPLOY_HOOK }}
