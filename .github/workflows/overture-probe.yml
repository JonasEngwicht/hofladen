name: Overture-Probe
on:
  push:
    branches: [probe/overture]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install duckdb==1.1.3
      - run: set -o pipefail; python scripts/overture-probe.py | tee probe.txt
      - uses: actions/upload-artifact@v4
        with: { name: overture-probe, path: "probe.txt\noverture-kandidaten.csv" }
