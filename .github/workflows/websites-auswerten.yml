name: Öffnungszeiten von Hof-Websites

# Liest Öffnungszeiten (und fehlende Telefon/E-Mail) von den eigenen Websites der Höfe,
# die in OpenStreetMap eine Website, aber keine Öffnungszeiten haben. Ergebnis: data/ergaenzungen.json.
# Bereits geprüfte Seiten werden erst nach 90 Tagen erneut abgerufen.
on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 1 * *' # monatlich am 1. um 04:23 UTC
  push:
    branches: [main]
    paths:
      - scripts/oeffnungszeiten-websites.mjs
      - .github/workflows/websites-auswerten.yml

permissions:
  contents: write

concurrency:
  group: daten
  cancel-in-progress: false

jobs:
  auswerten:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Parser-Selbsttest
        run: node scripts/oeffnungszeiten-websites.mjs --test
      - name: Websites auswerten
        run: node scripts/oeffnungszeiten-websites.mjs
      - name: Testbuild
        run: node scripts/build.mjs
      - name: Commit
        id: commit
        run: |
          git config user.name "hofladenliste-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ergaenzungen.json
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Öffnungszeiten von Hof-Websites ergänzt"
            git pull --rebase
            git push
            echo "geaendert=ja" >> "$GITHUB_OUTPUT"
          fi
      - name: Cloudflare-Deploy auslösen
        if: steps.commit.outputs.geaendert == 'ja'
        env:
          HOOK: ${{ secrets.CF_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "Secret CF_DEPLOY_HOOK fehlt."; exit 0; fi
          curl -fsS -X POST "$HOOK" > /dev/null && echo "Deploy ausgelöst."
