name: Öffnungszeiten von Hof-Websites

# Liest Öffnungszeiten (und fehlende Telefon/E-Mail) von den eigenen Websites der Höfe,
# die in OpenStreetMap eine Website, aber keine Öffnungszeiten haben. Ergebnis: data/ergaenzungen.json.
# Bereits geprüfte Seiten werden erst nach 90 Tagen erneut abgerufen.
on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 1 * *' # monatlich am 1. um 04:23 UTC
  push:
    branches: [main]
    paths:
      - scripts/oeffnungszeiten-websites.mjs
      - .github/workflows/websites-auswerten.yml

permissions:
  contents: write

concurrency:
  group: daten
  cancel-in-progress: false

jobs:
  auswerten:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Parser-Selbsttest
        run: node scripts/oeffnungszeiten-websites.mjs --test
      - name: Websites auswerten
        run: node scripts/oeffnungszeiten-websites.mjs
      - name: Testbuild
        run: node scripts/build.mjs
      - name: Commit
        id: commit
        uses: ./.github/actions/committen
        with:
          dateien: data/ergaenzungen.json
          nachricht: Öffnungszeiten von Hof-Websites ergänzt
      - name: Cloudflare-Deploy auslösen
        if: steps.commit.outputs.geaendert == 'ja'
        uses: ./.github/actions/deployen
        with:
          hook: ${{ secrets.CF_DEPLOY_HOOK }}
