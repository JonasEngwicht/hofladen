name: Bing-Webmaster-Diagnose

# Liest nur: wie sieht Bing hofladenliste.de (Sitemaps, Crawl, Fehler, Indexstatus)?
on:
  workflow_dispatch:
    inputs:
      urls:
        description: Zusätzliche URLs für den Indexstatus (durch Leerzeichen getrennt, leer = Standardauswahl)
        type: string
        default: ''

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Diagnose
        env:
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
          URLS: ${{ inputs.urls }}
        run: node scripts/bing-diagnose.mjs $URLS
