# Einmalig: Schriften von .woff nach .woff2 umwandeln (fonttools mit Brotli) und auf den Branch committen.
name: Schriften woff2
on:
  push:
    branches: [a7-woff2]
    paths: [.github/workflows/schriften-woff2.yml]
permissions:
  contents: write
jobs:
  woff2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install "fonttools[woff]==4.55.3"
      - name: Umwandeln
        run: |
          for f in static/fonts/*.woff; do
            python3 -c "import sys; from fontTools.ttLib import TTFont; t = TTFont(sys.argv[1]); t.flavor = 'woff2'; t.save(sys.argv[2])" "$f" "${f%.woff}.woff2"
          done
          ls -la static/fonts
          echo "## Schriften" >> "$GITHUB_STEP_SUMMARY"; ls -la static/fonts >> "$GITHUB_STEP_SUMMARY"
      - name: Committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/fonts/*.woff2
          git commit -m "Schriften als woff2 (fonttools)" && git push origin HEAD:a7-woff2
