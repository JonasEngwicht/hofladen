name: Betreiberdaten übernehmen

# Holt freigegebene Meldungen aus der Verwaltung (/verwaltung/), speichert sie in data/betreiber.json
# und data/fotos/, übernimmt den Stand der Ein-Klick-Rückmeldungen (data/rueckmeldungen.json) und rollt die Seite neu aus. Braucht das Repository-Secret ADMIN_TOKEN
# (derselbe Wert wie das Worker-Secret ADMIN_TOKEN).
on:
  workflow_dispatch:
  schedule:
    - cron: '41 */2 * * *' # alle zwei Stunden (Änderungen angemeldeter Betriebe)

permissions:
  contents: write

concurrency:
  group: daten
  cancel-in-progress: false

jobs:
  uebernehmen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Einrichtung prüfen (nur ja/nein, keine Werte)
        continue-on-error: true
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          curl -fsS -H "Authorization: Bearer $ADMIN_TOKEN" https://hofladenliste.de/api/verwaltung/einrichtung
      - name: Freigaben holen
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: node scripts/betreiber-uebernehmen.mjs https://hofladenliste.de
      - name: Rückmeldungen holen
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: node scripts/rueckmeldungen-uebernehmen.mjs https://hofladenliste.de
      - name: Testbuild
        run: node scripts/build.mjs
      - name: Commit, falls sich etwas geändert hat
        id: commit
        uses: ./.github/actions/committen
        with:
          dateien: data/betreiber.json data/fotos data/rueckmeldungen.json data/seiten-stand.json data/betrieb-export.json
          nachricht: Betreiberdaten übernommen
      - name: Cloudflare-Deploy auslösen
        if: steps.commit.outputs.geaendert == 'ja'
        uses: ./.github/actions/deployen
        with:
          hook: ${{ secrets.CF_DEPLOY_HOOK }}
