name: Bing URL-Übermittlung

# Meldet die wichtigsten Seiten (data/bing-wichtig.txt) per IndexNow an Bing.
# Braucht das Secret BING_API_KEY (IndexNow-Schlüssel aus bing.com/indexnow/getstarted)
# und die passende Schlüsseldatei static/<schlüssel>.txt auf der Live-Seite.
on:
  workflow_dispatch:
    inputs:
      datei:
        description: Liste mit URLs oder Pfaden (eine pro Zeile)
        type: string
        default: data/bing-wichtig.txt
      max:
        description: Höchstens so viele URLs senden (leer = alle)
        type: string
        default: ''

jobs:
  melden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: An Bing senden
        env:
          BING_API_KEY: ${{ secrets.BING_API_KEY }}
          DATEI: ${{ inputs.datei }}
          MAX: ${{ inputs.max }}
        run: node scripts/bing-melden.mjs --datei "$DATEI" ${MAX:+--max "$MAX"}
